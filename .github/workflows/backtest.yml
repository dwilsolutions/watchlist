name: Backtest

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker symbol'
        required: false
        default: 'QQQ'
      windows:
        description: 'Lookback windows in days (comma-separated)'
        required: false
        default: '30,60,90,120,360'

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run backtest
        run: |
          python scripts/backtest.py \
            --ticker "${{ github.event.inputs.ticker }}" \
            --windows "${{ github.event.inputs.windows }}" \
            --output-dir .

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_results.html backtest_results.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "backtest: ${{ github.event.inputs.ticker }} @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No changes to commit"
          fi
