name: Watchlist Auto-Score

on:
  schedule:
    - cron: '*/15 13-20 * * 1-5'  # Every 15 min 9:00 AM–4:00 PM ET — intraday scanner
  workflow_dispatch:
    inputs:
      session:
        description: 'Session to run'
        required: true
        default: 'premarket'
        type: choice
        options:
          - premarket
          - marketopen
          - midday
          - afterhours
          - eod
          - intraday

jobs:
  score-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          SESSION="${{ github.event.inputs.session }}"
          if [ "$SESSION" = "intraday" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            pip install yfinance pandas requests beautifulsoup4 pytz --quiet
          else
            pip install yfinance pandas --quiet
          fi

      - name: Run scorer or results
        env:
          FINVIZ_TOKEN: ${{ secrets.FINVIZ_TOKEN }}
        run: |
          SESSION="${{ github.event.inputs.session }}"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/intraday_scanner.py
          elif [ "$SESSION" = "intraday" ]; then
            python scripts/intraday_scanner.py
          elif [ "$SESSION" = "eod" ]; then
            python results.py
          else
            python scorer.py --session $SESSION
          fi

      - name: Commit and push
        run: |
          git config user.name  "Watchlist Bot"
          git config user.email "bot@watchlist"
          git add -A docs/ 2>/dev/null || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit"
          else
            git commit -m "Watchlist: ${{ github.event.inputs.session || 'intraday' }} $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
