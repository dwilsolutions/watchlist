name: Watchlist Auto-Score

on:
  workflow_dispatch:
    inputs:
      session:
        description: 'Session to run'
        required: true
        default: 'premarket'
        default: 'premarket'
        type: choice
        options:
          - premarket
          - marketopen
          - midday
          - afterhours
          - eod

jobs:
  score-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas --quiet

      - name: Run scorer or results
        env:
          FINVIZ_TOKEN: ${{ secrets.FINVIZ_TOKEN }}
        run: |
          SESSION="${{ github.event.inputs.session }}"
          if [ "$SESSION" = "eod" ]; then
            python results.py
          else
            python scorer.py --session $SESSION
          fi

      - name: Commit and push
        run: |
          git config user.name  "Watchlist Bot"
          git config user.email "bot@watchlist"
          git add -A docs/ 2>/dev/null || true
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit"
          else
            git commit -m "Watchlist: ${{ github.event.inputs.session }} $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
