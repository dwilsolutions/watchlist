name: Evaluate Scanner Log

# Scheduling is handled externally by cron-job.org which hits the workflow_dispatch
# API endpoint every weekday at 9:30 PM ET. When fired without a log_url input,
# the workflow auto-targets the previous trading day's log.
on:
  workflow_dispatch:
    inputs:
      log_url:
        description: 'Optional: specific log URL. Leave empty to auto-target yesterday.'
        required: false
        type: string

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Determine log URL
        id: url
        run: |
          if [ -n "${{ inputs.log_url }}" ]; then
            URL="${{ inputs.log_url }}"
            echo "Using user-provided URL: $URL"
          else
            # Use ET timezone directly — gives today's trading day regardless
            # of when this workflow fires (scheduled or manual).
            TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)
            URL="https://duanewilson.pythonanywhere.com/api/log/${TODAY_ET}"
            echo "Auto-targeting today's ET trading day: $TODAY_ET"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download scanner log
        run: |
          # /api/log/YYYY-MM-DD returns {"date":..., "count":..., "records":[...]}
          # We need to extract records and write as JSONL for evaluate_scan.py
          curl -sS "${{ steps.url.outputs.url }}" -o response.json
          python -c "
          import json
          with open('response.json') as f:
              data = json.load(f)
          records = data.get('records', [])
          date = data.get('date', 'unknown')
          fname = f'scan-{date}.jsonl'
          with open(fname, 'w') as f:
              for r in records:
                  f.write(json.dumps(r) + '\n')
          print(f'Wrote {len(records)} records to {fname}')
          # Save filename for next step
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as ge:
              ge.write(f'LOG_FILE={fname}\n')
              ge.write(f'LOG_DATE={date}\n')
          "

      - name: Run evaluation
        run: python evaluate_scan.py "${LOG_FILE}"

      - name: Commit results to repo
        run: |
          mkdir -p results
          mv evaluated-*.json results/ 2>/dev/null || true
          mv summary-*.json   results/ 2>/dev/null || true
          mv scan-*.jsonl     results/ 2>/dev/null || true

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "Evaluate scanner log ${LOG_DATE}"
          git push

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scanner-results-${{ env.LOG_DATE }}
          path: |
            results/evaluated-*.json
            results/summary-*.json
          retention-days: 30
